<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Web-Based Data Extraction Tool - Extract and download structured data from websites">
    <title>{% block title %}Web Data Extractor{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- Navigation Header -->
    <header class="navbar">
        <div class="container">
            <div class="navbar-content">
                <div class="navbar-brand">
                    <h1 class="logo">
                        <span class="logo-icon">⚙️</span>
                        Web Data Extractor
                    </h1>
                </div>
                <nav class="navbar-menu">
                    <a href="/" class="nav-link active">Home</a>
                    <a href="#about" class="nav-link">About</a>
                    <a href="#guide" class="nav-link">Guide</a>
                </nav>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Web-Based Data Extraction Tool. All rights reserved.</p>
            <p class="footer-subtitle">Extract structured data from any website with ease.</p>
        </div>
    </footer>

    <!-- JavaScript -->
    <script src="{{ url_for('static', filename='main.js') }}"></script>
    <script src="{{ url_for('static', filename='social_media.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
